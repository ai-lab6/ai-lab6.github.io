<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lab 6 실습 자료</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --border: #2a2f38;
        --accent: #8b85ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 16px 24px;
    }
    header h1 { margin: 0 0 8px; font-size: 2rem; }
    header p { margin: 0; color: var(--muted); }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    .card .icon { font-size: 2.2rem; }
    .card .num { font-size: .8rem; font-weight: 600; color: var(--accent); }
    .card h2 { margin: 0; font-size: 1.15rem; }
    .card .status {
      margin-top: auto;
      align-self: flex-start;
      font-size: .75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--border);
      color: var(--muted);
    }
    .card.disabled { cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AI Lab 6 실습 자료</h1>
    <p>실습 프로젝트 모음입니다. 각 카드를 누르면 해당 프로젝트 페이지로 이동합니다.</p>
  </header>

  <main>
    <!-- 링크가 준비되면 href="#"를 실제 주소로 바꾸고, class의 disabled와 '준비 중' 표시를 지우세요. -->
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">📝</span>
      <span class="num">PROJECT 01</span>
      <h2>할일 목록 리스트</h2>
      <span class="status">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">🐍</span>
      <span class="num">PROJECT 02</span>
      <h2>클로드 활용 스네이크 게임</h2>
      <span class="status">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">👤</span>
      <span class="num">PROJECT 03</span>
      <h2>개인 프로파일</h2>
      <span class="status">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">📈</span>
      <span class="num">PROJECT 04</span>
      <h2>주식 일기</h2>
      <span class="status">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">🦾</span>
      <span class="num">PROJECT 05</span>
      <h2>4축 로봇암 시뮬레이터</h2>
      <span class="status">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="icon">📚</span>
      <span class="num">PROJECT 06</span>
      <h2>이북(ebook) 쇼핑몰</h2>
      <span class="status">준비 중</span>
    </a>
  </main>

  <script>
    document.querySelectorAll('.card.disabled').forEach(function (card) {
      card.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>
</html>
