<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lab 6 대시보드</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --text: #0b0b0b;
      --text-2: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11, 11, 11, 0.10);
      --accent: #2a78d6;
      --good: #006300;
      --s1: #2a78d6;
      --s2: #eb6834;
      --s3: #1baf7a;
      --s4: #eda100;
      --tip-bg: #0b0b0b;
      --tip-text: #f0efec;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --text: #f0efec;
        --text-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --border: rgba(255, 255, 255, 0.10);
        --accent: #3987e5;
        --good: #0ca30c;
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --tip-bg: #f0efec;
        --tip-text: #0b0b0b;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --good: #0ca30c;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --tip-bg: #f0efec;
      --tip-text: #0b0b0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--page);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .panel h2 { margin: 0 0 4px; font-size: 1rem; }
    .panel .sub { margin: 0 0 16px; font-size: .8rem; color: var(--muted); }
    .section-title { margin: 32px 0 12px; font-size: 1.1rem; }

    /* 상단: 인사 + 시계 */
    .top {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
    }
    .greet h1 { margin: 0 0 6px; font-size: 1.6rem; }
    .greet p { margin: 0; color: var(--text-2); }
    .quote {
      margin-top: 16px;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      color: var(--text-2);
      font-size: .9rem;
    }
    .clock { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .clock .time {
      font-size: 2.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .clock .date { color: var(--text-2); }

    /* 지표 타일 */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    .stat .label { font-size: .8rem; color: var(--text-2); }
    .stat .value { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .value small { font-size: .9rem; font-weight: 500; color: var(--text-2); }
    .stat .delta { font-size: .8rem; color: var(--good); }
    .bar { height: 6px; background: var(--grid); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

    /* 차트 */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
      margin-top: 16px;
    }
    .chart-box { position: relative; }
    .pie-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .pie-wrap svg { width: 180px; height: 180px; flex: none; }
    .legend { list-style: none; margin: 0; padding: 0; font-size: .85rem; flex: 1; min-width: 140px; }
    .legend li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .legend .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .legend .name { color: var(--text-2); flex: 1; }
    .legend .pct { font-variant-numeric: tabular-nums; }
    .line-svg { width: 100%; height: 220px; display: block; }
    .tip {
      position: absolute;
      pointer-events: none;
      background: var(--tip-bg);
      color: var(--tip-text);
      font-size: .78rem;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -110%);
      transition: opacity .1s;
    }
    .tip.on { opacity: 1; }

    /* 프로젝트 카드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0, 0, 0, .08); }
    .card .icon { font-size: 2rem; }
    .card .num { font-size: .75rem; font-weight: 600; color: var(--accent); }
    .card h3 { margin: 0; font-size: 1.05rem; }
    .card .status {
      margin-top: auto;
      align-self: flex-start;
      font-size: .75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--grid);
      color: var(--text-2);
    }
    .card .status.live { background: var(--good); color: #fff; }
    .card.disabled { cursor: not-allowed; opacity: .75; }

    footer { margin-top: 40px; text-align: center; font-size: .8rem; color: var(--muted); }

    @media (max-width: 800px) {
      .top, .charts { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .clock .time { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 상단: 인사말 + 시계 -->
    <section class="top">
      <div class="panel greet">
        <h1 id="greeting">안녕하세요 👋</h1>
        <p>AI Lab 6 실습 대시보드입니다. 오늘도 한 걸음씩 만들어 가요.</p>
        <div class="quote" id="quote"></div>
      </div>
      <div class="panel clock">
        <div class="time" id="clock-time">--:--:--</div>
        <div class="date" id="clock-date"></div>
      </div>
    </section>

    <!-- 지표 타일 (데모 값: 아래 DATA.stats 에서 수정) -->
    <section class="stats" id="stats"></section>

    <!-- 차트 (데모 값: 아래 DATA.pie / DATA.line 에서 수정) -->
    <section class="charts">
      <div class="panel">
        <h2 id="pie-title"></h2>
        <p class="sub" id="pie-sub"></p>
        <div class="pie-wrap chart-box" id="pie-box">
          <svg id="pie" viewBox="0 0 200 200" role="img"></svg>
          <ul class="legend" id="pie-legend"></ul>
          <div class="tip" id="pie-tip"></div>
        </div>
      </div>
      <div class="panel">
        <h2 id="line-title"></h2>
        <p class="sub" id="line-sub"></p>
        <div class="chart-box" id="line-box">
          <svg class="line-svg" id="line" role="img"></svg>
          <div class="tip" id="line-tip"></div>
        </div>
      </div>
    </section>

    <!-- 프로젝트 링크 -->
    <h2 class="section-title">실습 프로젝트</h2>
    <section class="grid" id="projects"></section>

    <footer>© AI Lab 6 · ai-lab6.github.io</footer>
  </div>

  <script>
    /* =========================================================
       여기 값만 바꾸면 대시보드 내용이 바뀝니다. (현재는 데모 값)
       ========================================================= */
    var DATA = {
      stats: [
        { label: '완료한 프로젝트', value: 1, unit: '/ 6', progress: 1 / 6, delta: '+1 이번 주' },
        { label: '이번 주 학습 시간', value: 14.5, unit: '시간', delta: '+2.5h 지난주 대비' },
        { label: '연속 학습일', value: 7, unit: '일', delta: '최고 기록 갱신 중' },
        { label: '총 커밋 수', value: 42, unit: '회', delta: '+9 이번 주' }
      ],
      pie: {
        title: '기술 스택 비중',
        sub: '실습 코드 기준 (데모 데이터)',
        items: [
          { name: 'JavaScript', value: 45 },
          { name: 'HTML / CSS', value: 30 },
          { name: 'Python', value: 15 },
          { name: '기타', value: 10 }
        ]
      },
      line: {
        title: '일별 학습 시간',
        sub: '최근 7일 · 단위: 시간 (데모 데이터)',
        unit: '시간',
        labels: ['월', '화', '수', '목', '금', '토', '일'],
        values: [1.5, 2.0, 1.0, 2.5, 3.0, 2.5, 2.0]
      },
      projects: [
        { icon: '📝', name: '할일 목록 리스트', url: 'https://vercel-todo-app-eta.vercel.app/' },
        { icon: '🐍', name: '클로드 활용 스네이크 게임', url: '' },
        { icon: '👤', name: '개인 프로파일', url: '' },
        { icon: '📈', name: '주식 일기', url: '' },
        { icon: '🦾', name: '4축 로봇암 시뮬레이터', url: '' },
        { icon: '📚', name: '이북(ebook) 쇼핑몰', url: '' }
      ],
      quotes: [
        '“작게 시작해서 자주 배포하라.”',
        '“완벽보다 완성이 먼저다.”',
        '“오늘의 커밋 하나가 내일의 포트폴리오가 된다.”',
        '“모르는 것은 질문하고, 아는 것은 나눠라.”'
      ]
    };

    var SVG_NS = 'http://www.w3.org/2000/svg';
    function el(tag, attrs, parent) {
      var n = document.createElementNS(SVG_NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- 시계 & 인사말 ---------- */
    var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
      var d = new Date();
      document.getElementById('clock-time').textContent =
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      document.getElementById('clock-date').textContent =
        d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
      var h = d.getHours();
      var g = h < 6 ? '늦은 밤이에요 🌙' : h < 12 ? '좋은 아침이에요 ☀️' : h < 18 ? '좋은 오후예요 🌤️' : '좋은 저녁이에요 🌆';
      document.getElementById('greeting').textContent = g;
    }
    tick();
    setInterval(tick, 1000);
    document.getElementById('quote').textContent =
      DATA.quotes[new Date().getDate() % DATA.quotes.length];

    /* ---------- 지표 타일 ---------- */
    document.getElementById('stats').innerHTML = DATA.stats.map(function (s) {
      return '<div class="panel stat">' +
        '<div class="label">' + esc(s.label) + '</div>' +
        '<div class="value">' + esc(s.value) + ' <small>' + esc(s.unit) + '</small></div>' +
        (s.progress != null
          ? '<div class="bar"><span style="width:' + Math.round(s.progress * 100) + '%"></span></div>'
          : '') +
        '<div class="delta">' + esc(s.delta) + '</div>' +
        '</div>';
    }).join('');

    /* ---------- 파이 차트 (도넛) ---------- */
    (function () {
      var P = DATA.pie, svg = document.getElementById('pie');
      var tip = document.getElementById('pie-tip'), box = document.getElementById('pie-box');
      document.getElementById('pie-title').textContent = P.title;
      document.getElementById('pie-sub').textContent = P.sub;
      var total = P.items.reduce(function (a, b) { return a + b.value; }, 0);
      svg.setAttribute('aria-label', P.title + ': ' + P.items.map(function (i) {
        return i.name + ' ' + Math.round(i.value / total * 100) + '%';
      }).join(', '));
      var cx = 100, cy = 100, R = 90, r = 56, a0 = -Math.PI / 2;
      var legend = document.getElementById('pie-legend');
      P.items.forEach(function (it, i) {
        var color = 'var(--s' + (i % 4 + 1) + ')';
        var a1 = a0 + it.value / total * Math.PI * 2;
        var large = a1 - a0 > Math.PI ? 1 : 0;
        var d = 'M' + (cx + R * Math.cos(a0)) + ' ' + (cy + R * Math.sin(a0)) +
          ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + (cx + R * Math.cos(a1)) + ' ' + (cy + R * Math.sin(a1)) +
          ' L' + (cx + r * Math.cos(a1)) + ' ' + (cy + r * Math.sin(a1)) +
          ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + (cx + r * Math.cos(a0)) + ' ' + (cy + r * Math.sin(a0)) + 'Z';
        var pct = Math.round(it.value / total * 100);
        var path = el('path', { d: d, fill: color, stroke: 'var(--surface)', 'stroke-width': 2 }, svg);
        path.style.cursor = 'pointer';
        path.addEventListener('mousemove', function (e) {
          var b = box.getBoundingClientRect();
          tip.textContent = it.name + ' · ' + pct + '%';
          tip.style.left = (e.clientX - b.left) + 'px';
          tip.style.top = (e.clientY - b.top) + 'px';
          tip.classList.add('on');
          path.style.opacity = .85;
        });
        path.addEventListener('mouseleave', function () { tip.classList.remove('on'); path.style.opacity = 1; });
        legend.insertAdjacentHTML('beforeend',
          '<li><span class="sw" style="background:' + color + '"></span>' +
          '<span class="name">' + esc(it.name) + '</span><span class="pct">' + pct + '%</span></li>');
        a0 = a1;
      });
      var c1 = el('text', { x: 100, y: 98, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: 'var(--text)' }, svg);
      c1.textContent = P.items.length;
      var c2 = el('text', { x: 100, y: 118, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--text-2)' }, svg);
      c2.textContent = '항목';
    })();

    /* ---------- 꺾은선 그래프 ---------- */
    function drawLine() {
      var L = DATA.line, svg = document.getElementById('line');
      var tip = document.getElementById('line-tip'), box = document.getElementById('line-box');
      document.getElementById('line-title').textContent = L.title;
      document.getElementById('line-sub').textContent = L.sub;
      svg.setAttribute('aria-label', L.title + ': ' + L.labels.map(function (l, i) {
        return l + ' ' + L.values[i] + L.unit;
      }).join(', '));
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      var W = svg.clientWidth || 600, H = 220;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      var m = { l: 36, r: 16, t: 12, b: 28 };
      var iw = W - m.l - m.r, ih = H - m.t - m.b;
      var max = Math.ceil(Math.max.apply(null, L.values));
      var n = L.values.length;
      function x(i) { return m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)); }
      function y(v) { return m.t + ih - v / max * ih; }

      // 그리드 & 축
      for (var g = 0; g <= max; g++) {
        el('line', { x1: m.l, x2: W - m.r, y1: y(g), y2: y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }, svg);
        var t = el('text', { x: m.l - 8, y: y(g) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, svg);
        t.textContent = g;
      }
      L.labels.forEach(function (lb, i) {
        var t = el('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, svg);
        t.textContent = lb;
      });

      // 면적 + 선
      var pts = L.values.map(function (v, i) { return x(i) + ',' + y(v); });
      el('polygon', { points: x(0) + ',' + y(0) + ' ' + pts.join(' ') + ' ' + x(n - 1) + ',' + y(0), fill: 'var(--s1)', opacity: .12 }, svg);
      el('polyline', { points: pts.join(' '), fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);

      // 마지막 값 직접 라벨
      var last = el('text', { x: x(n - 1) - 6, y: y(L.values[n - 1]) - 10, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 600, fill: 'var(--text)' }, svg);
      last.textContent = L.values[n - 1] + L.unit;

      // 호버: 세로 가이드선 + 점 + 툴팁
      var guide = el('line', { y1: m.t, y2: m.t + ih, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' }, svg);
      var dot = el('circle', { r: 5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }, svg);
      var hit = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
      hit.addEventListener('mousemove', function (e) {
        var b = svg.getBoundingClientRect();
        var px = (e.clientX - b.left) * W / b.width;
        var i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / iw * (n - 1))));
        guide.setAttribute('x1', x(i)); guide.setAttribute('x2', x(i));
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(L.values[i]));
        guide.setAttribute('visibility', 'visible'); dot.setAttribute('visibility', 'visible');
        var bb = box.getBoundingClientRect();
        tip.textContent = L.labels[i] + ' · ' + L.values[i] + L.unit;
        tip.style.left = (x(i) * b.width / W + b.left - bb.left) + 'px';
        tip.style.top = (y(L.values[i]) * b.height / H + b.top - bb.top - 8) + 'px';
        tip.classList.add('on');
      });
      hit.addEventListener('mouseleave', function () {
        guide.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden');
        tip.classList.remove('on');
      });
    }
    drawLine();
    window.addEventListener('resize', drawLine);

    /* ---------- 프로젝트 카드 ---------- */
    document.getElementById('projects').innerHTML = DATA.projects.map(function (p, i) {
      var live = !!p.url;
      return '<a class="card' + (live ? '' : ' disabled') + '" ' +
        (live ? 'href="' + esc(p.url) + '" target="_blank" rel="noopener"' : 'href="#" aria-disabled="true"') + '>' +
        '<span class="icon">' + p.icon + '</span>' +
        '<span class="num">PROJECT ' + pad(i + 1) + '</span>' +
        '<h3>' + esc(p.name) + '</h3>' +
        '<span class="status' + (live ? ' live' : '') + '">' + (live ? '✓ 바로가기 ↗' : '준비 중') + '</span>' +
        '</a>';
    }).join('');
    document.querySelectorAll('.card.disabled').forEach(function (c) {
      c.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>
</html>
